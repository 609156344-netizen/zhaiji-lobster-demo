<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta http-equiv="Expires" content="0">

  <!-- 引入 Tailwind CSS (仅处理样式) -->

  <!-- 引入 FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- 自定义样式 -->
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* 禁止整体网页滚动，滑动仅在内部内容区生效 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f8fafc;
    }
    /* 测算沙盘的自定义滑块样式 */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #dc2626;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
      border: 4px solid #fff;
    }
    input[type=range]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #dc2626;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(220, 38, 38, 0.5);
      border: 4px solid #fff;
    }
  </style>
</head>
<body class="text-slate-800 font-sans selection:bg-red-100 selection:text-red-900">
  
  <!-- 密码验证遮罩层 -->
  <div id="password-overlay" class="fixed inset-0 z-[9999] bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center">
    <div class="bg-white rounded-3xl shadow-2xl p-8 md:p-10 max-w-md w-full mx-4 text-center transform transition-all">
      <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fa-solid fa-lock text-red-600 text-3xl"></i>
      </div>
      <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">翟记龙虾</h2>
      <p class="text-slate-500 mb-6">请输入访问密码查看招商演示</p>
      <div class="relative mb-6">
        <input 
          type="password" 
          id="password-input" 
          class="w-full px-5 py-4 border-2 border-slate-200 rounded-2xl text-lg focus:outline-none focus:border-red-500 transition-colors text-center"
          placeholder="请输入密码"
          onkeypress="if(event.key==='Enter')verifyPassword()"
        >
      </div>
      <button 
        onclick="verifyPassword()" 
        class="w-full py-4 bg-red-600 hover:bg-red-700 text-white font-bold text-lg rounded-2xl transition-all shadow-lg shadow-red-600/30 active:scale-95"
      >
        <i class="fa-solid fa-arrow-right mr-2"></i>进入演示
      </button>
      <p id="error-msg" class="text-red-500 text-sm mt-4 hidden font-medium">
        <i class="fa-solid fa-circle-exclamation mr-1"></i>密码错误，请重新输入
      </p>
    </div>
  </div>

    <div class="w-full h-1 bg-slate-200 z-50 shrink-0 absolute top-0 left-0">
      <div id="progress-bar" class="h-full bg-red-600 transition-all duration-500 ease-out" style="width: 0%"></div>
    </div>

    <!-- 主内容区域 (原生自适应) -->
    <main class="flex-1 relative flex items-center justify-center p-4 md:p-8 overflow-hidden bg-gradient-to-br from-slate-50 to-slate-100 mt-1 mb-[72px] md:mb-[80px]">
      <div id="slide-container" class="w-full max-w-5xl max-h-full flex flex-col transition-all duration-400 opacity-100 translate-y-0">
        <!-- 幻灯片内容将通过JS原生渲染在这里 -->
      </div>
    </main>

    <!-- 底部悬浮控制台 -->
    <footer class="bg-white/90 backdrop-blur-md border-t border-slate-200/50 px-4 md:px-8 py-3 md:py-4 flex items-center justify-between shrink-0 z-50 absolute bottom-0 w-full h-[72px] md:h-[80px]">
      <button id="prev-btn" onclick="prevSlide()" class="flex items-center justify-center gap-1.5 md:gap-2 px-4 md:px-5 py-2 md:py-2.5 rounded-full font-semibold transition-all text-sm md:text-base hover:bg-slate-200 active:scale-95">
        <i class="fa-solid fa-chevron-left text-[16px] md:text-[18px]"></i> <span class="hidden sm:inline">上一步</span>
      </button>
      
      <!-- 页面指示器 -->
      <div id="dots-container" class="flex items-center gap-1.5 md:gap-2 flex-wrap justify-center max-w-[50%]"></div>

      </button>
    </footer>
  </div>

              <div class="flex-1 rounded-2xl md:rounded-3xl p-6 md:p-8 flex flex-col relative overflow-hidden transition-all duration-300 ${tier.highlight ? 'bg-gradient-to-b from-red-600 to-red-800 text-white shadow-2xl md:scale-105 z-10 border border-red-500' : 'bg-white text-slate-800 border border-slate-200 shadow-sm'}">
                ${tier.highlight ? '<div class="absolute -right-4 -top-4 opacity-10"><i class="fa-solid fa-fire text-[120px]"></i></div>' : ''}
                <div class="inline-block px-3 py-1 rounded-full text-xs md:text-sm font-bold mb-4 w-max ${tier.highlight ? 'bg-red-500/80 text-white' : 'bg-slate-100 text-slate-500'}">${tier.tag}</div>
                <h3 class="text-xl md:text-2xl font-black mb-2 ${tier.highlight ? 'text-white' : 'text-slate-800'}">${tier.name}</h3>
                <div class="text-lg md:text-xl font-bold mb-4 ${tier.highlight ? 'text-red-100' : 'text-red-600'}">${tier.desc}</div>
                <div class="text-3xl md:text-4xl font-black tracking-tight mb-4">${tier.profit}</div>
                <div class="mb-4 py-2.5 px-3 rounded-lg text-xs md:text-sm font-mono leading-tight ${tier.highlight ? 'bg-white/10 text-red-50 border border-white/20' : 'bg-slate-50 text-slate-600 border border-slate-200'}">
                  <i class="fa-solid fa-calculator mr-1 opacity-70"></i> ${tier.formula}
                </div>
                <p class="text-sm md:text-base leading-relaxed flex-1 ${tier.highlight ? 'text-red-50' : 'text-slate-600'}">${tier.detail}</p>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (slide.type === 'interactive-math') {
        contentHtml = `
          <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-slate-100 w-full max-w-5xl mx-auto flex flex-col h-full justify-center">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center">
              <div class="space-y-6 md:space-y-8">
                <div>
                  <div class="flex justify-between mb-2 md:mb-3">
                    <span class="font-bold text-slate-700 text-lg md:text-xl">客单价 (元)</span>
                    <span id="val-price" class="text-red-600 font-black text-xl md:text-2xl">¥${slide.defaults.price}</span>
                  </div>
                  <input type="range" id="input-price" min="50" max="200" step="1" value="${slide.defaults.price}" class="w-full h-2 md:h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600 outline-none">
                </div>
                <div>
                  <div class="flex justify-between mb-2 md:mb-3">
                    <span class="font-bold text-slate-700 text-lg md:text-xl">日均单量 (单)</span>
                    <span id="val-orders" class="text-red-600 font-black text-xl md:text-2xl">${slide.defaults.orders}单</span>
                  </div>
                  <input type="range" id="input-orders" min="10" max="500" step="1" value="${slide.defaults.orders}" class="w-full h-2 md:h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                  <div>
                    <div class="flex justify-between mb-2">
                      <span class="font-bold text-slate-700 text-sm md:text-base">月房租水电</span>
                      <span id="val-rent" class="text-slate-900 font-black text-sm md:text-base">¥${slide.defaults.rent}</span>
                    </div>
                    <input type="range" id="input-rent" min="2000" max="30000" step="500" value="${slide.defaults.rent}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600 outline-none">
                  </div>
                  <div>
                    <div class="flex justify-between mb-2">
                      <span class="font-bold text-slate-700 text-sm md:text-base">月人工工资</span>
                      <span id="val-labor" class="text-slate-900 font-black text-sm md:text-base">¥${slide.defaults.labor}</span>
                    </div>
                    <input type="range" id="input-labor" min="5000" max="60000" step="1000" value="${slide.defaults.labor}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-red-600 outline-none">
                  </div>
                </div>
                <div class="p-4 md:p-5 bg-slate-50 rounded-2xl border border-slate-100">
                  <h4 class="text-sm font-bold text-slate-400 mb-3 uppercase tracking-wider">经营扣点底线 (不可更改)</h4>
                  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm md:text-base font-medium">
                    <div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-circle-check text-green-500"></i> 食材物料 ${slide.configs.foodCostRate * 100}%</div>
                    <div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-circle-check text-green-500"></i> 平台扣点 ${(slide.configs.platformRate * 100).toFixed(1)}%</div>
                    <div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-circle-check text-green-500"></i> 运营提成 ${slide.configs.brandRate * 100}%</div>
                    <div class="flex items-center gap-2 text-slate-600"><i class="fa-solid fa-circle-check text-green-500"></i> 其他成本 ${slide.configs.otherRate * 100}%</div>
                  </div>
                </div>
              </div>

              <div class="flex flex-col justify-center gap-6 md:gap-8">
                <div class="p-8 md:p-10 bg-gradient-to-br from-red-600 to-red-700 rounded-3xl text-white shadow-2xl shadow-red-600/30 text-center relative overflow-hidden transition-all duration-300" id="profit-card">
                  <div class="absolute -right-6 -top-6 opacity-10"><i class="fa-solid fa-sack-dollar text-[160px]"></i></div>
                  <p class="text-red-100 font-bold mb-2 text-lg md:text-xl">预计月度净利润</p>
                  <div id="res-profit" class="text-6xl md:text-7xl font-black font-mono tracking-tight transition-all duration-300">¥ 0</div>
                </div>
                <div class="grid grid-cols-2 gap-4 md:gap-6">
                  <div class="p-6 bg-slate-900 rounded-2xl text-center shadow-lg">
                    <p class="text-slate-400 text-sm md:text-base font-bold mb-2">单笔纯利</p>
                    <div id="res-single" class="text-white text-3xl md:text-4xl font-black font-mono">¥ 0</div>
                  </div>
                  <div class="p-6 bg-white border-2 border-slate-200 rounded-2xl text-center shadow-sm">
                    <p class="text-slate-500 text-sm md:text-base font-bold mb-2">每日保本线</p>
                    <div id="res-be" class="text-red-600 text-3xl md:text-4xl font-black font-mono">0单</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        
        // 渲染完成后，延迟绑定交互事件
        setTimeout(() => initInteractiveMath(slide), 0);
      }
      else if (slide.type === 'image-gallery') {
        contentHtml = `
          <div class="flex flex-col items-center justify-center h-full w-full py-4">
            <div class="flex gap-4 md:gap-6 overflow-x-auto w-full pb-4 snap-x snap-mandatory no-scrollbar justify-start md:justify-center">
              ${slide.images.map(img => `
                <div class="shrink-0 w-72 md:w-80 h-96 md:h-[450px] bg-slate-200 rounded-2xl overflow-hidden shadow-lg border border-slate-200 snap-center relative group">
                  <img src="${img}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="真实后台数据" onerror="this.src='https://via.placeholder.com/400x600?text=图片加载失败'" />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-4">
                     <span class="text-white font-bold tracking-wide"><i class="fa-solid fa-image mr-2"></i>后台实时截图</span>
                  </div>
                </div>
              `).join('')}
            </div>
            <p class="text-sm md:text-base text-slate-400 mt-2 font-medium">${slide.note}</p>
          </div>
        `;
      }
      else if (slide.type === 'warning-cards') {
        contentHtml = `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 py-2 md:py-4">
            ${slide.cards.map((card) => `
              <div class="p-6 md:p-8 rounded-2xl md:rounded-3xl bg-white border border-slate-200 shadow-sm flex flex-col items-center text-center opacity-95 hover:opacity-100 hover:shadow-md transition-all group">
                <div class="w-16 h-16 md:w-20 md:h-20 rounded-full flex items-center justify-center mb-4 md:mb-6 bg-slate-50 group-hover:bg-slate-100 transition-colors">
                  <i class="${card.iconClass} text-[28px] md:text-[36px]"></i>
                </div>
                <h3 class="text-lg md:text-xl font-bold mb-3 md:mb-4 text-slate-700">${card.title}</h3>
                <p class="text-sm md:text-base leading-relaxed text-slate-500">${card.text}</p>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (slide.type === 'math') {
        contentHtml = `
          <div class="max-w-4xl mx-auto space-y-3 md:space-y-4 w-full">
            ${slide.steps.map((step, i) => `
              <div class="flex flex-col md:flex-row items-start md:items-center justify-between p-4 md:p-6 rounded-2xl ${step.highlight ? 'bg-red-50 border-2 border-red-200' : 'bg-white border border-slate-100 shadow-sm'}">
                <div class="mb-2 md:mb-0">
                  <div class="flex items-center gap-2 md:gap-3 mb-1.5 md:mb-2">
                    <span class="w-5 h-5 md:w-6 md:h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs md:text-sm font-bold">${i+1}</span>
                    <span class="font-bold text-base md:text-lg text-slate-800">${step.label}</span>
                  </div>
                  <div class="text-slate-500 font-mono text-sm md:text-base pl-7 md:pl-9">${step.formula}</div>
                </div>
                <div class="text-2xl md:text-4xl font-black font-mono md:text-right w-full md:w-auto text-right ${step.highlight ? 'text-red-600' : 'text-slate-900'}">${step.result}</div>
              </div>
            `).join('')}
            ${slide.conclusion ? `
            <div class="mt-4 md:mt-6 p-4 md:p-6 bg-slate-900 rounded-2xl text-center flex items-center justify-center gap-2 md:gap-3 shadow-lg">
              <i class="fa-solid fa-circle-check text-green-400 text-[20px] md:text-[28px]"></i>
              <span class="text-lg md:text-2xl font-bold text-white">${slide.conclusion}</span>
            </div>` : ''}
          </div>
        `;
      }
      else if (slide.type === 'timeline') {
        contentHtml = `
          <div class="relative border-l-2 md:border-l-4 border-red-100 ml-4 md:ml-6 space-y-6 md:space-y-8 py-2 md:py-4">
            ${slide.items.map(item => `
              <div class="relative pl-6 md:pl-10">
                <div class="absolute -left-[14px] md:-left-[18px] top-1 w-6 h-6 md:w-8 md:h-8 bg-white border-2 md:border-4 border-red-100 rounded-full flex items-center justify-center shadow-sm">
                  <div class="w-2 h-2 md:w-3 md:h-3 bg-red-600 rounded-full"></div>
                </div>
                <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-1.5 md:mb-2">${item.title}</h3>
                <p class="text-slate-600 text-sm md:text-lg leading-relaxed bg-white p-3 md:p-5 rounded-xl border border-slate-100 shadow-sm inline-block">${item.text}</p>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (slide.type === 'vision-roadmap') {
        contentHtml = `
          <div class="w-full h-full flex flex-col items-center justify-center py-2 md:py-4">
            <div class="text-center mb-8 md:mb-10 shrink-0">
              <div class="inline-block px-4 py-1.5 mb-3 md:mb-4 rounded-full bg-red-50 border border-red-100 text-red-600 font-bold text-xs md:text-sm tracking-widest uppercase">Milestones & Future</div>
              <h2 class="text-3xl md:text-4xl lg:text-5xl font-black tracking-tight text-slate-900 mb-3">${slide.title}</h2>
              <p class="text-slate-500 text-base md:text-lg font-medium">${slide.subtitle}</p>
            </div>

            <div class="w-full max-w-5xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-5">
              ${slide.milestones.map((m, i) => `
                <div class="relative p-5 md:p-6 rounded-2xl md:rounded-3xl border flex flex-col h-full transition-all duration-300 ${
                  m.status === 'active' ? 'bg-red-50 border-red-300 shadow-lg shadow-red-600/10 lg:scale-105 z-10' : 
                  m.status === 'past' ? 'bg-white border-slate-200 shadow-sm' : 
                  'bg-white border-slate-200 border-dashed shadow-sm opacity-80'
                }">
                  ${m.status === 'active' ? '<div class="absolute -top-2 -right-2 flex h-4 w-4 md:h-5 md:w-5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span><span class="relative inline-flex rounded-full h-4 w-4 md:h-5 md:w-5 bg-red-500"></span></div>' : ''}
                  
                  <div class="flex items-center gap-2 mb-3">
                    <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm ${
                      m.status === 'active' ? 'bg-red-600 text-white' : 
                      m.status === 'past' ? 'bg-slate-100 text-slate-500' : 'bg-slate-50 text-slate-400'
                    }">
                      ${m.status === 'past' ? '<i class="fa-solid fa-check"></i>' : m.status === 'active' ? '<i class="fa-solid fa-fire"></i>' : '<i class="fa-solid fa-arrow-trend-up"></i>'}
                    </div>
                    <div class="text-xs md:text-sm font-bold ${m.status === 'active' ? 'text-red-600' : 'text-slate-500'}">${m.time}</div>
                  </div>
                  
                  <h3 class="text-lg md:text-xl font-bold mb-2 md:mb-3 ${m.status === 'active' ? 'text-slate-900' : 'text-slate-700'}">${m.title}</h3>
                  <p class="text-sm md:text-base leading-relaxed flex-1 ${m.status === 'active' ? 'text-slate-700' : 'text-slate-500'}">${m.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
      else if (slide.type === 'cta') {
        contentHtml = `
          <div class="my-auto flex flex-col items-center justify-center text-center py-8 md:py-12">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-red-50 text-red-600 rounded-full flex items-center justify-center mb-6 md:mb-8 animate-bounce shadow-xl shadow-red-600/20">
              <i class="fa-solid fa-handshake-angle text-[32px] md:text-[40px]"></i>
            </div>
            <h2 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4 md:mb-6">${slide.title}</h2>
            <p class="text-lg md:text-2xl font-medium text-slate-600 mb-8 md:mb-10 max-w-2xl">
              ${slide.subtitle} <br/><span class="text-slate-500 text-base md:text-lg font-normal mt-2 block">${slide.description}</span>
            </p>
            <button onclick="location.reload()" class="group flex items-center gap-2 md:gap-3 bg-red-600 hover:bg-red-700 text-white px-6 md:px-8 py-3 md:py-4 rounded-full text-lg md:text-2xl font-bold transition-all shadow-xl shadow-red-600/30 hover:-translate-y-1 active:scale-95">
              立即预约实地考察
              <i class="fa-solid fa-arrow-right group-hover:translate-x-2 transition-transform text-[20px] md:text-[24px]"></i>
            </button>
          </div>
        `;
      }

      // 给容器增加一点上下内边距防止贴边，特别是在手机上
      html += `<div class="flex-1 overflow-y-auto no-scrollbar pb-6 md:pb-10 pt-2 flex flex-col w-full h-full">${contentHtml}</div>`;
      container.innerHTML = html;

      // 更新进度条
      progressBar.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;

      // 更新下方指示器小点
      dotsContainer.innerHTML = slides.map((_, i) => `
        <button onclick="goToSlide(${i})" class="h-1.5 md:h-2 rounded-full transition-all duration-300 ${i === currentSlide ? 'bg-red-600 w-6 md:w-8' : 'bg-slate-200 w-1.5 md:w-2 hover:bg-slate-300'}"></button>
      `).join('');

      // 更新按钮状态
      if (currentSlide === 0) {
        prevBtn.disabled = true;
        prevBtn.className = "flex items-center justify-center gap-1.5 md:gap-2 px-4 md:px-5 py-2 md:py-2.5 rounded-full font-bold transition-all text-sm md:text-base text-slate-300 bg-slate-50 cursor-not-allowed";
      } else {
        prevBtn.disabled = false;
        prevBtn.className = "flex items-center justify-center gap-1.5 md:gap-2 px-4 md:px-5 py-2 md:py-2.5 rounded-full font-bold transition-all text-sm md:text-base text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95";
      }

      if (currentSlide === slides.length - 1) {
        nextBtn.innerHTML = `重新开始`;
      } else {
        nextBtn.innerHTML = `<span>下一步 <i class="fa-solid fa-chevron-right text-[16px] md:text-[18px]"></i></span>`;
      }
    }

    // 页面跳转逻辑及过渡动画
    function changeSlide(newIndex) {
      if (isAnimating) return;
      isAnimating = true;

      // 1. 触发淡出 (只做透明度变化，去掉位移避免跳动感)
      container.classList.remove('opacity-100', 'translate-y-0');
      container.classList.add('opacity-0', '-translate-y-2');

      // 2. 等待淡出结束后更换内容并淡入
      setTimeout(() => {
        currentSlide = newIndex;
        renderSlide();

        // 请求下一帧以确保 DOM 更新后应用过渡类名
        requestAnimationFrame(() => {
          container.classList.remove('opacity-0', '-translate-y-2');
          container.classList.add('opacity-100', 'translate-y-0');
          
          setTimeout(() => {
            isAnimating = false;
          }, 300); // 对应动画 duration
        });
      }, 150); // 加快切换速度，更加灵敏
    }

    function nextSlide() {
      changeSlide(currentSlide === slides.length - 1 ? 0 : currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide === 0) return;
      changeSlide(currentSlide - 1);
    }

    function goToSlide(index) {
      if (index === currentSlide) return;
      changeSlide(index);
    }

    // 初始化计算沙盘的逻辑
    function initInteractiveMath(slide) {
      const pInput = document.getElementById('input-price');
      const oInput = document.getElementById('input-orders');
      const rInput = document.getElementById('input-rent');
      const lInput = document.getElementById('input-labor');
      
      if(!pInput || !oInput || !rInput || !lInput) return;
      
      const update = () => {
        const price = parseInt(pInput.value);
        const orders = parseInt(oInput.value);
        const rent = parseInt(rInput.value);
        const labor = parseInt(lInput.value);
        
        const fixedCost = rent + labor;
        
        // 更新滑块上的显示数值
        document.getElementById('val-price').innerText = `¥${price}`;
        document.getElementById('val-orders').innerText = `${orders}单`;
        document.getElementById('val-rent').innerText = `¥${rent}`;
        document.getElementById('val-labor').innerText = `¥${labor}`;
        
        // 核心利润逻辑计算
        // 纯利比例 = 1 - 食材 - 平台 - 代运营 - 其他
        const singleProfit = price * (1 - slide.configs.foodCostRate - slide.configs.platformRate - slide.configs.brandRate - slide.configs.otherRate);
        const monthlyProfit = (singleProfit * orders * 30) - fixedCost;
        // 每日保本线 = 月固定成本 / (单笔纯利 * 30)
        const breakEven = Math.ceil(fixedCost / (singleProfit * 30));
        
        // 更新结果面板
        document.getElementById('res-single').innerText = `¥${singleProfit.toFixed(1)}`;
        
        const profitCard = document.getElementById('profit-card');
        const profitEl = document.getElementById('res-profit');
        
        if (monthlyProfit < 0) {
            profitEl.innerText = `-¥${Math.abs(monthlyProfit).toLocaleString()}`;
            profitCard.classList.remove('from-red-600', 'to-red-700', 'shadow-red-600/30');
            profitCard.classList.add('from-slate-600', 'to-slate-700', 'shadow-slate-600/30');
        } else {
            profitEl.innerText = `¥${monthlyProfit.toLocaleString()}`;
            profitCard.classList.remove('from-slate-600', 'to-slate-700', 'shadow-slate-600/30');
            profitCard.classList.add('from-red-600', 'to-red-700', 'shadow-red-600/30');
        }
        
        // 当单笔利润小于等于0时，保本单量为无限大
        if (singleProfit <= 0) {
           document.getElementById('res-be').innerText = `无法保本`;
        } else {
           document.getElementById('res-be').innerText = `${breakEven}单`;
        }
      };

      pInput.addEventListener('input', update);
      oInput.addEventListener('input', update);
      rInput.addEventListener('input', update);
      lInput.addEventListener('input', update);
      update(); // 初始执行一次刷新页面显示
    }

    // 密码验证功能
    const CORRECT_PASSWORD = '123456'; // 可自行修改密码
    const overlay = document.getElementById('password-overlay');
    const passwordInput = document.getElementById('password-input');
    const errorMsg = document.getElementById('error-msg');

    function checkVerification() {
      const verified = sessionStorage.getItem('password_verified');
      if (verified === 'true') {
        overlay.style.display = 'none';
      }
    }

    function verifyPassword() {
      const password = passwordInput.value;
      if (password === CORRECT_PASSWORD) {
        sessionStorage.setItem('password_verified', 'true');
        overlay.style.display = 'none';
        errorMsg.classList.add('hidden');
      } else {
        errorMsg.classList.remove('hidden');
        passwordInput.classList.add('animate-shake');
        setTimeout(() => {
          passwordInput.classList.remove('animate-shake');
        }, 300);
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    // 添加抖动动画样式
    document.head.insertAdjacentHTML('beforeend', `
      <style>
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-10px); }
          75% { transform: translateX(10px); }
        }
        .animate-shake {
          animation: shake 0.3s ease-in-out;
        }
      </style>
    `);

    // 页面加载时检查是否已验证
    window.addEventListener('DOMContentLoaded', function() {
      checkVerification();
      passwordInput.focus();
    });

    // 初始化渲染
    renderSlide();

  </script>
</body>
</html>
