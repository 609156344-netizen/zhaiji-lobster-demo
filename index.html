    // ==========================================
    // 密码验证配置
    // ==========================================
    const ACCESS_PASSWORD = 'zhaiji2026'; // 修改此密码为你的专属密码

    function checkPassword() {
      const input = document.getElementById('password-input').value;
      const overlay = document.getElementById('password-overlay');
      const error = document.getElementById('password-error');
      
      if (input === ACCESS_PASSWORD) {
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';
        setTimeout(() => {
          overlay.style.display = 'none';
        }, 300);
        // 初始化幻灯片
        renderSlide();
      } else {
        error.classList.remove('hidden');
        document.getElementById('password-input').classList.add('border-red-500', 'animate-shake');
        setTimeout(() => {
          document.getElementById('password-input').classList.remove('border-red-500', 'animate-shake');
        }, 500);
      }
    }

    function togglePassword() {
      const input = document.getElementById('password-input');
      const btn = document.getElementById('toggle-btn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-solid fa-eye-slash text-xl"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-solid fa-eye text-xl"></i>';
      }
    }

    // 添加抖动动画样式
    document.head.insertAdjacentHTML('beforeend', `
      <style>
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          25% { transform: translateX(-10px); }
          75% { transform: translateX(10px); }
        }
        .animate-shake {
          animation: shake 0.3s ease-in-out;
        }
      </style>
    `);
  </script>

      // 给容器增加一点上下内边距防止贴边，特别是在手机上
      html += `<div class="flex-1 overflow-y-auto no-scrollbar pb-6 md:pb-10 pt-2 flex flex-col w-full">${contentHtml}</div>`;
      container.innerHTML = html;

      // 更新进度条
      progressBar.style.width = `${((currentSlide + 1) / slides.length) * 100}%`;

      // 更新下方指示器小点
      dotsContainer.innerHTML = slides.map((_, i) => `
        <button onclick="goToSlide(${i})" class="h-1.5 md:h-2 rounded-full transition-all duration-300 ${i === currentSlide ? 'bg-red-600 w-6 md:w-8' : 'bg-slate-200 w-1.5 md:w-2 hover:bg-slate-300'}"></button>
      `).join('');

      // 更新按钮状态
      if (currentSlide === 0) {
        prevBtn.disabled = true;
        prevBtn.className = "flex items-center justify-center gap-1.5 md:gap-2 px-4 md:px-5 py-2 md:py-2.5 rounded-full font-bold transition-all text-sm md:text-base text-slate-300 bg-slate-50 cursor-not-allowed";
      } else {
        prevBtn.disabled = false;
        prevBtn.className = "flex items-center justify-center gap-1.5 md:gap-2 px-4 md:px-5 py-2 md:py-2.5 rounded-full font-bold transition-all text-sm md:text-base text-slate-600 bg-slate-100 hover:bg-slate-200 active:scale-95";
      }

      if (currentSlide === slides.length - 1) {
        nextBtn.innerHTML = `重新开始`;
      } else {
        nextBtn.innerHTML = `<span>下一步 <i class="fa-solid fa-chevron-right text-[16px] md:text-[18px]"></i></span>`;
      }
    }

    // 页面跳转逻辑及过渡动画
    function changeSlide(newIndex) {
      if (isAnimating) return;
      isAnimating = true;

      // 1. 触发淡出 (只做透明度变化，去掉位移避免跳动感)
      container.classList.remove('opacity-100', 'translate-y-0');
      container.classList.add('opacity-0', '-translate-y-2');

      // 2. 等待淡出结束后更换内容并淡入
      setTimeout(() => {
        currentSlide = newIndex;
        renderSlide();

        // 请求下一帧以确保 DOM 更新后应用过渡类名
        requestAnimationFrame(() => {
          container.classList.remove('opacity-0', '-translate-y-2');
          container.classList.add('opacity-100', 'translate-y-0');
          
          setTimeout(() => {
            isAnimating = false;
          }, 300); // 对应动画 duration
        });
      }, 150); // 加快切换速度，更加灵敏
    }

    function nextSlide() {
      changeSlide(currentSlide === slides.length - 1 ? 0 : currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide === 0) return;
      changeSlide(currentSlide - 1);
    }

    function goToSlide(index) {
      if (index === currentSlide) return;
      changeSlide(index);
    }

    // 注意：renderSlide() 会在密码验证通过后自动调用

  </script>
</body>
</html>
